name: Ella iOS Source CI

on:
  pull_request:
    branches:
      - codex/815-device-rejection-successor
      - feature/phase-a-testflight
      - main
    paths:
      - app/**
      - backend/main.py
      - backend/database/authority_advisory_lock.py
      - backend/database/ella_provisioning.py
      - backend/database/honcho_attestation.py
      - backend/database/managed_cloud_consent.py
      - backend/database/runtime_targets.py
      - backend/database/voice_canary.py
      - backend/ella/routers/ai_consent.py
      - backend/ella/routers/guardian.py
      - backend/ella/routers/resolve.py
      - backend/ella/routers/escalations.py
      - backend/ella/routers/chat.py
      - backend/ella/routers/canonical_events.py
      - backend/ella/routers/corrections.py
      - backend/ella/routers/voice.py
      - backend/ella/routers/callbacks.py
      - backend/ella/services/runtime_resolver.py
      - backend/ella/services/ai_consent.py
      - backend/ella/services/consent_authority.py
      - backend/ella/services/correction_propagation.py
      - backend/ella/services/hermes_cloud.py
      - backend/ella/services/hermes_cloud_policy.py
      - backend/ella/services/hermes_cloud_staged_attestation.py
      - backend/ella/services/provisioning.py
      - backend/ella/services/runtime_errors.py
      - backend/ella/services/summary_recovery.py
      - backend/ella/services/summary_writeback.py
      - backend/ella/utils/provision_authority.py
      - backend/tests/unit/test_ella_correction_startup_contract.py
      - backend/tests/unit/test_ella_conversation_corrections.py
      - backend/tests/unit/test_ella_correction_runtime_resolver.py
      - backend/tests/unit/test_ella_guardian_delivery.py
      - backend/tests/unit/test_ella_canonical_context.py
      - backend/tests/unit/test_ella_canonical_event_version_fence.py
      - backend/tests/unit/test_ella_canonical_omi.py
      - backend/tests/unit/test_ella_user_route_auth.py
      - backend/utils/ella/exact_firebase_auth.py
      - backend/utils/ella/canonical_omi.py
      - backend/utils/ella/scanner.py
      - backend/utils/notifications.py
      - backend/tests/unit/test_guardian_notification_delivery.py
      - .github/workflows/ella-ios-source-ci.yml
  workflow_dispatch:
    inputs:
      immutable_base_sha:
        description: Immutable ancestor SHA used for the complete source-stack diff
        required: true
        type: string

concurrency:
  group: ella-ios-source-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flutter-source:
    name: Flutter source, guards, and tests
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      ELLA_CI_FLUTTER_VERSION: 3.41.1
      ELLA_CI_NETWORK_SANDBOX: >-
        (version 1) (allow default) (deny network*)
        (allow network-inbound (local ip "localhost:*"))
        (allow network-outbound (remote ip "localhost:*"))
    defaults:
      run:
        shell: bash
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable source head receipt
        working-directory: .
        env:
          ELLA_EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          [[ "$ELLA_EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Source CI requires an exact immutable head SHA." >&2
            exit 1
          }
          actual_head="$(git rev-parse HEAD)"
          [[ "$actual_head" == "$ELLA_EXPECTED_HEAD_SHA" ]] || {
            echo "Source CI checkout mismatch: expected $ELLA_EXPECTED_HEAD_SHA, got $actual_head." >&2
            exit 1
          }
          echo "ELLA_SOURCE_HEAD_SHA=$actual_head" >> "$GITHUB_ENV"
          echo "Immutable source head: $actual_head"
          {
            echo "### Ella iOS Source CI receipt"
            echo
            echo "Immutable source head: \`$actual_head\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify credential-free source CI scope
        working-directory: .
        run: |
          set -euo pipefail

          workflow=".github/workflows/ella-ios-source-ci.yml"
          forbidden_ci_terms='(ASC_|KEYCHAIN|TestFlight|appstore|app-store|build-and-upload|xcodebuild|fastlane|codesign|mobileprovision|\.p8|\.p12)'
          if grep -Ev 'forbidden_ci_terms|forbidden_artifact_paths|secret_patterns|Credentialed iOS build/upload terms|grep -EIn|workflow=' "$workflow" \
            | grep -EIn "$forbidden_ci_terms"; then
            echo "Credentialed iOS build/upload terms are not allowed in this hosted source CI workflow." >&2
            exit 1
          fi

      - name: Diff and signing artifact scan
        working-directory: .
        env:
          ELLA_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          ELLA_DISPATCH_BASE_SHA: ${{ inputs.immutable_base_sha }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            base_ref="${ELLA_PR_BASE_SHA}"
          else
            base_ref="${ELLA_DISPATCH_BASE_SHA}"
          fi

          [[ "$base_ref" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Source CI requires an exact 40-character immutable base SHA." >&2
            exit 1
          }
          git cat-file -e "${base_ref}^{commit}"
          git merge-base --is-ancestor "$base_ref" HEAD || {
            echo "Source CI base $base_ref is not an ancestor of HEAD $(git rev-parse HEAD)." >&2
            exit 1
          }
          printf '%s\n' "$base_ref" > /tmp/ella-ios-source-ci-base-ref.txt

          git diff --check "${base_ref}...HEAD"
          git diff --name-only "${base_ref}...HEAD" | tee /tmp/ella-ios-source-ci-changed-files.txt
          while IFS= read -r -d '' changed_path; do
            case "$changed_path" in
              app/*|backend/main.py|backend/database/authority_advisory_lock.py|backend/database/ella_provisioning.py|backend/database/honcho_attestation.py|backend/database/managed_cloud_consent.py|backend/database/runtime_targets.py|backend/database/voice_canary.py|backend/ella/routers/ai_consent.py|backend/ella/routers/callbacks.py|backend/ella/routers/canonical_events.py|backend/ella/routers/chat.py|backend/ella/routers/corrections.py|backend/ella/routers/escalations.py|backend/ella/routers/guardian.py|backend/ella/routers/resolve.py|backend/ella/routers/voice.py|backend/ella/services/ai_consent.py|backend/ella/services/consent_authority.py|backend/ella/services/correction_propagation.py|backend/ella/services/hermes_cloud.py|backend/ella/services/hermes_cloud_policy.py|backend/ella/services/hermes_cloud_staged_attestation.py|backend/ella/services/provisioning.py|backend/ella/services/runtime_errors.py|backend/ella/services/runtime_resolver.py|backend/ella/services/summary_recovery.py|backend/ella/services/summary_writeback.py|backend/ella/utils/provision_authority.py|backend/utils/ella/canonical_omi.py|backend/utils/ella/exact_firebase_auth.py|backend/utils/ella/scanner.py|backend/utils/notifications.py|backend/tests/unit/test_ella_canonical_context.py|backend/tests/unit/test_ella_canonical_event_version_fence.py|backend/tests/unit/test_ella_canonical_omi.py|backend/tests/unit/test_ella_conversation_corrections.py|backend/tests/unit/test_ella_correction_runtime_resolver.py|backend/tests/unit/test_ella_correction_startup_contract.py|backend/tests/unit/test_ella_guardian_delivery.py|backend/tests/unit/test_ella_user_route_auth.py|backend/tests/unit/test_guardian_notification_delivery.py|docs/compliance/ella-managed-cloud-consent-v*.md|.github/workflows/ella-ios-source-ci.yml) ;;
              *)
                echo "Ella iOS source CI rejects unrelated changed path: $changed_path" >&2
                exit 1
                ;;
            esac
          done < <(git diff --name-only -z "${base_ref}...HEAD")

          forbidden_artifact_paths='(^|/)(AuthKey_[^/]*\.p8|[^/]*\.(p8|p12|cer|mobileprovision|provisionprofile|xcarchive|ipa))$'
          if grep -EIn "$forbidden_artifact_paths" /tmp/ella-ios-source-ci-changed-files.txt; then
            echo "Signing certificates, provisioning profiles, archives, and IPA artifacts must not be committed." >&2
            exit 1
          fi

      - name: Diff secret scan
        working-directory: .
        run: |
          set -euo pipefail

          base_ref="$(cat /tmp/ella-ios-source-ci-base-ref.txt)"

          git diff --unified=0 "${base_ref}...HEAD" > /tmp/ella-ios-source-ci.diff
          secret_patterns='(-----BEGIN ((RSA|DSA|EC|OPENSSH) )?PRIVATE KEY-----|AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{35}|gh[pousr]_[A-Za-z0-9_]{36,}|sk-(live|test)-[A-Za-z0-9]{20,}|sk-proj-[A-Za-z0-9_-]{20,}|xox[baprs]-[A-Za-z0-9-]{20,})'
          if grep -EIn "$secret_patterns" /tmp/ella-ios-source-ci.diff; then
            echo "Potential secret found in PR diff." >&2
            exit 1
          fi

      - name: Run executable native Guardian production manager and auth boundaries
        working-directory: .
        run: |
          set -euo pipefail
          swiftc -warnings-as-errors -D GUARDIAN_NATIVE_POLICY_TESTS \
            app/ios/Runner/GuardianMode/GuardianNativePolicy.swift \
            app/ios/Runner/GuardianMode/GuardianModePollingService.swift \
            app/ios/Tests/GuardianNativePolicyTests.swift \
            -o "$RUNNER_TEMP/guardian-native-policy-tests"
          "$RUNNER_TEMP/guardian-native-policy-tests"

      - name: Run Guardian data-only production boundary tests
        working-directory: .
        run: |
          python3 -m venv "$RUNNER_TEMP/guardian-python"
          source "$RUNNER_TEMP/guardian-python/bin/activate"
          python -m pip install --disable-pip-version-check \
            pytest==8.4.2 \
            fastapi==0.112.0 \
            firebase-admin==6.5.0 \
            httpx==0.28.0 \
            asyncpg==0.31.0 \
            python-multipart==0.0.9
          python -m unittest backend/tests/unit/test_guardian_notification_delivery.py
          python -m pytest backend/tests/unit/test_ella_guardian_delivery.py \
            -k 'guardian_next_audio_auth or guardian_playback_auth or guardian_mode'
          python -m pytest backend/tests/unit/test_ella_user_route_auth.py

      - name: Run exact correction terminal-receipt contracts
        working-directory: .
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/guardian-python/bin/activate"
          python -m py_compile \
            backend/main.py \
            backend/database/authority_advisory_lock.py \
            backend/database/ella_provisioning.py \
            backend/database/honcho_attestation.py \
            backend/database/managed_cloud_consent.py \
            backend/database/runtime_targets.py \
            backend/database/voice_canary.py \
            backend/ella/routers/ai_consent.py \
            backend/ella/routers/canonical_events.py \
            backend/ella/routers/corrections.py \
            backend/ella/services/ai_consent.py \
            backend/ella/services/consent_authority.py \
            backend/ella/services/correction_propagation.py \
            backend/ella/services/hermes_cloud.py \
            backend/ella/services/hermes_cloud_policy.py \
            backend/ella/services/hermes_cloud_staged_attestation.py \
            backend/ella/services/provisioning.py \
            backend/ella/services/runtime_errors.py \
            backend/ella/services/runtime_resolver.py \
            backend/ella/services/summary_recovery.py \
            backend/ella/services/summary_writeback.py \
            backend/ella/utils/provision_authority.py \
            backend/utils/ella/canonical_omi.py \
            backend/utils/ella/exact_firebase_auth.py
          cd backend
          python -m pytest --collect-only -q \
            tests/unit/test_ella_correction_startup_contract.py \
            tests/unit/test_ella_correction_runtime_resolver.py \
            tests/unit/test_ella_conversation_corrections.py \
            tests/unit/test_ella_canonical_omi.py \
            tests/unit/test_ella_canonical_event_version_fence.py |
            tee /tmp/correction-terminal-receipt-collection.log
          correction_ids="$(sed '/^$/d' /tmp/correction-terminal-receipt-collection.log)"
          required_correction_ids=(
            "tests/unit/test_ella_correction_startup_contract.py::test_runtime_resolver_imports_real_in_tree_dependency_closure"
            "tests/unit/test_ella_correction_startup_contract.py::test_ella_enabled_main_startup_registers_correction_routes_and_keeps_consent_fail_closed"
            "tests/unit/test_ella_correction_runtime_resolver.py::test_self_hosted_correction_transcript_mode_maps_to_hermes_chat"
            "tests/unit/test_ella_conversation_corrections.py::test_generate_corrected_summary_binds_two_owners_to_two_current_runtimes_with_zero_legacy_egress"
            "tests/unit/test_ella_conversation_corrections.py::test_provider_egress_revalidates_consent_after_slow_runtime_authority_resolution"
            "tests/unit/test_ella_conversation_corrections.py::test_correction_routes_use_deployed_exact_auth_and_current_consent_dependencies"
            "tests/unit/test_ella_conversation_corrections.py::test_retry_failed_correction_reuses_existing_id_and_fences_completed_side_effects"
            "tests/unit/test_ella_conversation_corrections.py::test_retry_failed_correction_rejects_changed_active_version_before_any_write"
            "tests/unit/test_ella_conversation_corrections.py::test_retry_failed_correction_reclaims_stale_lost_task_without_reclaiming_live_lease"
            "tests/unit/test_ella_conversation_corrections.py::test_canonical_pending_reconciliation_is_serialized_and_stale_completion_is_fenced"
            "tests/unit/test_ella_conversation_corrections.py::test_initial_queued_correction_reclaims_expired_lost_background_task_but_not_live_lease"
            "tests/unit/test_ella_conversation_corrections.py::test_revoked_consent_after_source_commit_is_terminal_failed_until_required_receipts_exist"
            "tests/unit/test_ella_conversation_corrections.py::test_exact_receipt_poll_reclaims_stale_initial_queue_but_not_live_lease"
            "tests/unit/test_ella_conversation_corrections.py::test_correction_terminal_sla_caps_provider_and_matches_client_budget_with_margin"
            "tests/unit/test_ella_conversation_corrections.py::test_correction_writeback_never_publishes_applied_before_canonical_durability"
            "tests/unit/test_ella_conversation_corrections.py::test_canonical_success_survives_confirmation_marker_failure_and_replays_without_second_source_cas"
            "tests/unit/test_ella_conversation_corrections.py::test_canonical_failure_after_source_cas_stays_pending_then_retry_reconciles_without_second_provider_or_source_write"
            "tests/unit/test_ella_conversation_corrections.py::test_receipt_reconciles_stale_failure_to_applied_only_after_all_durable_receipts"
            "tests/unit/test_ella_conversation_corrections.py::test_source_correction_precedes_downstream_side_effects_and_duplicate_replay_is_fenced"
            "tests/unit/test_ella_conversation_corrections.py::test_revoked_consent_terminalizes_background_retry_and_receipt_recovery_without_provider_egress"
            "tests/unit/test_ella_conversation_corrections.py::test_initial_submission_transaction_is_stable_across_crash_and_response_loss"
            "tests/unit/test_ella_conversation_corrections.py::test_end_to_end_deadline_covers_slow_runtime_resolution_and_slow_canonical_writer"
            "tests/unit/test_ella_conversation_corrections.py::test_expired_publication_lease_recovers_ack_loss_with_exact_idempotent_replay"
            "tests/unit/test_ella_conversation_corrections.py::test_crash_after_publication_claim_before_remote_write_reclaims_after_bounded_lease"
            "tests/unit/test_ella_conversation_corrections.py::test_undo_cannot_overtake_canonical_pending_or_publication_inflight"
            "tests/unit/test_ella_conversation_corrections.py::test_terminal_applied_is_fenced_after_source_cas_before_each_downstream_receipt[proposal]"
            "tests/unit/test_ella_conversation_corrections.py::test_terminal_applied_is_fenced_after_source_cas_before_each_downstream_receipt[canonical_event]"
            "tests/unit/test_ella_conversation_corrections.py::test_terminal_applied_is_fenced_after_source_cas_before_each_downstream_receipt[propagation]"
            "tests/unit/test_ella_conversation_corrections.py::test_multiple_lost_reclaimers_exhaust_one_persisted_attempt_budget"
            "tests/unit/test_ella_canonical_event_version_fence.py::test_stale_corrected_publisher_cannot_overwrite_newer_undo"
            "tests/unit/test_ella_canonical_event_version_fence.py::test_ack_loss_replay_of_exact_canonical_version_is_a_confirmed_duplicate"
            "tests/unit/test_ella_canonical_event_version_fence.py::test_same_version_generation_fences_reclaimed_worker_before_and_after_undo"
            "tests/unit/test_ella_conversation_corrections.py::test_propagation_sink_transaction_rejects_expired_reclaimed_and_post_undo_publishers"
            "tests/unit/test_ella_conversation_corrections.py::test_undo_terminal_transaction_is_atomic_and_exact_retry_repairs_legacy_pair"
            "tests/unit/test_ella_conversation_corrections.py::test_repeated_undo_repairs_mismatched_terminal_pair_without_appending_version"
            "tests/unit/test_ella_conversation_corrections.py::test_revocation_at_final_canonical_and_downstream_boundaries_prevents_all_egress"
            "tests/unit/test_ella_conversation_corrections.py::test_propagation_revalidates_before_related_transcript_read_and_proposal_write"
            "tests/unit/test_ella_conversation_corrections.py::test_receipt_audit_identity_or_status_mismatch_fails_closed_without_echo"
            "tests/unit/test_ella_conversation_corrections.py::test_n8n_submission_is_bounded_by_the_existing_monotonic_deadline"
            "tests/unit/test_ella_conversation_corrections.py::test_hosted_source_ci_checks_out_and_receipts_exact_pull_request_head_with_scans_preserved"
          )
          for required_id in "${required_correction_ids[@]}"; do
            grep -Fqx "$required_id" <<<"$correction_ids"
          done
          test "$(grep -c '::' <<<"$correction_ids")" -eq 100
          python -m pytest \
            tests/unit/test_ella_correction_startup_contract.py \
            tests/unit/test_ella_correction_runtime_resolver.py \
            tests/unit/test_ella_conversation_corrections.py \
            tests/unit/test_ella_canonical_omi.py \
            tests/unit/test_ella_canonical_event_version_fence.py \
            -v | tee /tmp/correction-terminal-receipt-pytest.log
          ! grep -Eq '[0-9]+ skipped' /tmp/correction-terminal-receipt-pytest.log

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.ELLA_CI_FLUTTER_VERSION }}
          channel: stable
          cache: false

      - name: Verify pinned Flutter version
        run: |
          set -euo pipefail

          expected_flutter_version="$ELLA_CI_FLUTTER_VERSION"
          actual_flutter_version="$(flutter --version | sed -n 's/^Flutter \([^ ]*\).*/\1/p')"
          if [[ "$actual_flutter_version" != "$expected_flutter_version" ]]; then
            echo "Ella source CI must pin Flutter $expected_flutter_version, found $actual_flutter_version." >&2
            exit 1
          fi

          flutter --version
          dart --version

      - name: Resolve pinned Dart dependencies
        run: flutter pub get --enforce-lockfile

      - name: Enforce pinned Dart formatting for changed source
        run: |
          set -euo pipefail

          changed_dart_files=()
          while IFS= read -r changed_path; do
            case "$changed_path" in
              app/*.dart|app/**/*.dart) changed_dart_files+=("${changed_path#app/}") ;;
            esac
          done < /tmp/ella-ios-source-ci-changed-files.txt

          if [[ "${#changed_dart_files[@]}" -eq 0 ]]; then
            echo "No changed Dart files require formatting."
            exit 0
          fi

          dart format --output=none --set-exit-if-changed --line-length 120 "${changed_dart_files[@]}"

      - name: Verify protected test network sandbox
        run: |
          set -euo pipefail

          if /usr/bin/sandbox-exec -p "$ELLA_CI_NETWORK_SANDBOX" \
            /usr/bin/curl --fail --silent --show-error --max-time 5 https://api.github.com >/dev/null 2>&1; then
            echo "Network sandbox did not block outbound traffic." >&2
            exit 1
          fi

      - name: Run app/test.sh setup and smoke tests
        run: ELLA_TEST_NO_PUB=true /usr/bin/sandbox-exec -p "$ELLA_CI_NETWORK_SANDBOX" ./test.sh

      - name: Enforce focused test collection counts
        run: |
          set -euo pipefail

          expected_issue_test_count=45
          issue_test_count="$(find test/ella test/backend test/pages/onboarding/ella -type f -name '*_test.dart' | sort | tee /tmp/ella-issue-tests.txt | wc -l | tr -d ' ')"
          if [[ "$issue_test_count" -ne "$expected_issue_test_count" ]]; then
            cat /tmp/ella-issue-tests.txt
            echo "Expected $expected_issue_test_count Ella/backend/onboarding source tests, found $issue_test_count." >&2
            exit 1
          fi

          expected_app_test_count=73
          all_app_test_count="$(find test -type f -name '*_test.dart' | sort | tee /tmp/ella-all-app-tests.txt | wc -l | tr -d ' ')"
          if [[ "$all_app_test_count" -ne "$expected_app_test_count" ]]; then
            cat /tmp/ella-all-app-tests.txt
            echo "Expected $expected_app_test_count Flutter test files, found $all_app_test_count." >&2
            exit 1
          fi

      - name: Analyze changed Ella iOS source with fatal warnings
        run: |
          set -euo pipefail

          changed_dart_files=()
          while IFS= read -r changed_path; do
            case "$changed_path" in
              app/lib/l10n/app_localizations*.dart) continue ;;
              app/*.dart|app/**/*.dart) changed_dart_files+=("${changed_path#app/}") ;;
            esac
          done < /tmp/ella-ios-source-ci-changed-files.txt

          if [[ "${#changed_dart_files[@]}" -eq 0 ]]; then
            echo "No changed Dart files require analysis."
            exit 0
          fi

          /usr/bin/sandbox-exec -p "$ELLA_CI_NETWORK_SANDBOX" \
            flutter analyze --no-pub --fatal-warnings --no-fatal-infos "${changed_dart_files[@]}"

      - name: Run focused invite, entitlement, quota, consent, and routing tests
        run: |
          set -euo pipefail

          focused_tests=(
            test/backend/audio_consent_guard_test.dart
            test/backend/preferences_public_mode_test.dart
            test/pages/onboarding/ella/ella_onboarding_consent_test.dart
            test/pages/onboarding/ella/ella_onboarding_pilot_locale_test.dart
            test/ella/widgets/ai_consent_sheet_test.dart
            test/ella/services/ai_consent_policy_test.dart
            test/ella/services/ai_consent_coordinator_test.dart
            test/ella/services/ai_consent_active_session_lease_test.dart
            test/ella/services/protected_egress_consent_test.dart
            test/ella/services/ella_chat_consent_test.dart
            test/ella/services/ella_invite_link_controller_test.dart
            test/ella/services/ella_entitlement_service_test.dart
            test/ella/services/ella_entitlement_provider_test.dart
            test/ella/account_isolation_test.dart
            test/services/wals/wal_account_isolation_test.dart
            test/ella/public_build_call_paths_test.dart
            test/ella/pages/ella_entitlement_gate_page_test.dart
            test/ella/pages/ella_provisioning_gate_page_test.dart
            test/ella/pages/home_provisioning_gate_test.dart
            test/ella/services/ella_provisioning_service_test.dart
            test/ella/services/guardian_mode_api_test.dart
            test/ella/pages/ella_voice_quota_states_test.dart
            test/ella/services/v2v_client_test.dart
            test/ella/services/voice_session_startup_guard_test.dart
            test/ella/widgets/v2v_fallback_dialog_test.dart
            test/pages/conversation_detail/type_correction_terminal_receipt_test.dart
          )

          expected_focused_test_count=26
          if [[ "${#focused_tests[@]}" -ne "$expected_focused_test_count" ]]; then
            echo "Focused source test manifest count drifted." >&2
            exit 1
          fi
          for test_file in "${focused_tests[@]}"; do
            [[ -f "$test_file" ]] || { echo "Missing focused test: $test_file" >&2; exit 1; }
          done

          /usr/bin/sandbox-exec -p "$ELLA_CI_NETWORK_SANDBOX" flutter test --no-pub "${focused_tests[@]}"

      - name: Run conflicting public and internal call-path configurations
        run: |
          set -euo pipefail

          conflicting_defines=(
            --dart-define=ELLA_CALL_PATH_CONFIG_TEST=true
            --dart-define=ELLA_ACCESS_DEMO_GALLERY=true
            --dart-define=DEBUG_AUTO_CALL=true
            --dart-define=ELLA_TODAY_DESIGN_PREVIEW=true
            --dart-define=ELLA_ENTITLEMENT_STUBS=true
            --dart-define=ELLA_HERMES_PROVISIONING_GATE=false
          )

          /usr/bin/sandbox-exec -p "$ELLA_CI_NETWORK_SANDBOX" flutter test --no-pub \
            test/ella/public_build_call_paths_test.dart \
            "${conflicting_defines[@]}" \
            --dart-define=ELLA_PUBLIC_BUILD=true \
            --dart-define=ELLA_GUARDIAN_ENABLED=true

          /usr/bin/sandbox-exec -p "$ELLA_CI_NETWORK_SANDBOX" flutter test --no-pub \
            test/ella/public_build_call_paths_test.dart \
            "${conflicting_defines[@]}" \
            --dart-define=ELLA_PUBLIC_BUILD=false

          /usr/bin/sandbox-exec -p "$ELLA_CI_NETWORK_SANDBOX" flutter test --no-pub \
            test/ella/public_build_call_paths_test.dart \
            "${conflicting_defines[@]}" \
            --dart-define=ELLA_PUBLIC_BUILD=true \
            --dart-define=ELLA_ENTITLEMENT_GATE=true \
            --dart-define=ELLA_GUARDIAN_ENABLED=true

      - name: Run full Flutter tests
        run: /usr/bin/sandbox-exec -p "$ELLA_CI_NETWORK_SANDBOX" flutter test --no-pub
