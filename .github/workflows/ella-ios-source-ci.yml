      - name: Print exact-head gate receipt
        working-directory: .
        run: |
          set -euo pipefail

          head_sha="$(cat /tmp/ella-ios-source-ci-head-sha.txt)"
          checked_out_head="$(git rev-parse HEAD)"
          [[ "$checked_out_head" == "$head_sha" ]] || {
            echo "Source CI checkout changed during gate: headSha=$head_sha checkedOutHead=$checked_out_head" >&2
            exit 1
          }
          printf 'Ella source gate receipt: headSha=%s checkedOutHead=%s baseSha=%s\n' \
            "$head_sha" "$checked_out_head" "$(cat /tmp/ella-ios-source-ci-base-ref.txt)"

  postgres-ordering-contract:
    name: PostgreSQL 16 ordering and range contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ELLA_EXPECTED_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      ELLA_TEST_POSTGRES_DATABASE: postgres
      ELLA_TEST_POSTGRES_HOST: 127.0.0.1
      ELLA_TEST_POSTGRES_PASSWORD: postgres
      ELLA_TEST_POSTGRES_PORT: "5432"
      ELLA_TEST_POSTGRES_USER: postgres

    steps:
      - name: Checkout immutable source head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify immutable checked-out head
        run: |
          set -euo pipefail

          expected_sha="$ELLA_EXPECTED_HEAD_SHA"
          actual_sha="$(git rev-parse HEAD)"
          [[ "$expected_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "PostgreSQL contract requires an exact 40-character immutable head SHA." >&2
            exit 1
          }
          [[ "$actual_sha" == "$expected_sha" ]] || {
            echo "PostgreSQL contract checkout mismatch: expectedSha=$expected_sha actualSha=$actual_sha" >&2
            exit 1
          }
          printf 'PostgreSQL contract head receipt: expectedSha=%s actualSha=%s\n' "$expected_sha" "$actual_sha"

      - name: Run exact real PostgreSQL regression
        working-directory: backend
        run: |
          set -euo pipefail

          python3 -m venv "$RUNNER_TEMP/postgres-contract-python"
          source "$RUNNER_TEMP/postgres-contract-python/bin/activate"
          python3 -m pip install --disable-pip-version-check \
            pytest==8.4.2 \
            fastapi==0.112.0 \
            firebase-admin==6.5.0 \
            httpx==0.28.0 \
            asyncpg==0.31.0 \
            python-multipart==0.0.9 \
            websockets==15.0.1

          expected_test_count=4
          expected_test_ids=(
            'tests/unit/test_ella_v2v_turn_persistence.py::test_real_postgres_bounds_and_legacy_oversized_metadata_are_range_safe'
            'tests/unit/test_ella_v2v_turn_persistence.py::test_real_postgres_case_distinct_owner_isolation_and_numeric_string_limit_order'
            'tests/unit/test_ella_v2v_turn_persistence.py::test_real_postgres_bounds_and_legacy_oversized_metadata_are_range_safe_for_composed_rebound_replay'
            'tests/unit/test_ella_v2v_turn_persistence.py::test_real_postgres_mounted_voice_route_and_context_helper_keep_case_distinct_owners_private'
          )
          collection_output="$(python3 -m pytest --collect-only -q "${expected_test_ids[@]}")"
          printf '%s\n' "$collection_output"
          actual_test_ids="$(printf '%s\n' "$collection_output" | grep '::' || true)"
          actual_test_count="$(printf '%s\n' "$actual_test_ids" | grep -c '::' || true)"
          [[ "$actual_test_count" -eq "$expected_test_count" ]] || {
            echo "PostgreSQL regression collection mismatch: expectedCount=$expected_test_count actualCount=$actual_test_count" >&2
            exit 1
          }
          for expected_test_id in "${expected_test_ids[@]}"; do
            [[ "$(printf '%s\n' "$actual_test_ids" | grep -Fxc "$expected_test_id" || true)" -eq 1 ]] || {
              echo "PostgreSQL regression missing or duplicated exact test ID: $expected_test_id" >&2
              exit 1
            }
          done
          printf 'PostgreSQL regression collection receipt: expectedCount=%s actualCount=%s testIds=%s\n' \
            "$expected_test_count" "$actual_test_count" "${expected_test_ids[*]}"

          execution_output="$(python3 -m pytest -q -rA "${expected_test_ids[@]}")"
          printf '%s\n' "$execution_output"
          actual_pass_count="$(printf '%s\n' "$execution_output" | grep -c '^PASSED .*::' || true)"
          [[ "$actual_pass_count" -eq "$expected_test_count" ]] || {
            echo "PostgreSQL regression execution mismatch: expectedCount=$expected_test_count actualCount=$actual_pass_count" >&2
            exit 1
          }
          if printf '%s\n' "$execution_output" | grep -Eqi '(^|[[:space:]])(skipped|deselected)([[:space:]]|$)'; then
            echo "PostgreSQL regression gate requires zero skips and zero deselections." >&2
            exit 1
          fi
          for expected_test_id in "${expected_test_ids[@]}"; do
            [[ "$(printf '%s\n' "$execution_output" | grep -Fxc "PASSED $expected_test_id" || true)" -eq 1 ]] || {
              echo "PostgreSQL regression did not pass exact test ID once: $expected_test_id" >&2
              exit 1
            }
          done
          printf 'PostgreSQL regression execution receipt: expectedCount=%s actualCount=%s skipped=0 deselected=0 testIds=%s\n' \
            "$expected_test_count" "$actual_pass_count" "${expected_test_ids[*]}"

          expected_sha="$ELLA_EXPECTED_HEAD_SHA"
          actual_sha="$(git rev-parse HEAD)"
          [[ "$actual_sha" == "$expected_sha" ]] || {
            echo "PostgreSQL contract checkout changed during test: expectedSha=$expected_sha actualSha=$actual_sha" >&2
            exit 1
          }
          printf 'PostgreSQL contract final receipt: expectedSha=%s actualSha=%s expectedCount=%s actualCount=%s skipped=0 deselected=0 testIds=%s\n' \
            "$expected_sha" "$actual_sha" "$expected_test_count" "$actual_pass_count" "${expected_test_ids[*]}"

  callback-summary-cas-contract:
    name: Callback 79, artwork 63, and Firestore 6 contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ELLA_EXPECTED_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout immutable source head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify immutable checked-out head
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          [[ "$ELLA_EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$actual_sha" == "$ELLA_EXPECTED_HEAD_SHA" ]]
          printf 'Callback/CAS contract head receipt: expectedSha=%s actualSha=%s\n' \
            "$ELLA_EXPECTED_HEAD_SHA" "$actual_sha"

      - name: Run exact callback summary inventory
        working-directory: backend
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/callback-cas-python"
          source "$RUNNER_TEMP/callback-cas-python/bin/activate"
          python -m pip install --disable-pip-version-check \
            pytest==8.4.2 \
            fastapi==0.112.0 \
            firebase-admin==6.5.0 \
            google-api-core==2.34.0 \
            google-auth==2.56.3 \
            google-cloud-core==2.6.1 \
            google-cloud-firestore==2.28.1 \
            httpx==0.28.0 \
            asyncpg==0.31.0 \
            python-multipart==0.0.9 \
            pillow==10.4.0

          callback_ids="$(python -m pytest --collect-only -q tests/unit/test_ella_callbacks_summary_update.py | sed '/^$/d')"
          callback_count="$(grep -c '::' <<<"$callback_ids")"
          [[ "$callback_count" -eq 79 ]] || {
            echo "Callback collection mismatch: expectedCount=79 actualCount=$callback_count" >&2
            exit 1
          }
          python -m pytest -q -rA tests/unit/test_ella_callbacks_summary_update.py \
            | tee /tmp/callback-summary-pytest.log
          grep -Eq '79 passed' /tmp/callback-summary-pytest.log
          ! grep -Eqi '(^|[[:space:]])(skipped|deselected)([[:space:]]|$)' /tmp/callback-summary-pytest.log
          printf 'Callback summary execution receipt: expectedCount=79 actualCount=79 skipped=0 deselected=0\n'

      - name: Run exact memory artwork contract inventory
        working-directory: backend
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/callback-cas-python/bin/activate"
          artwork_ids="$(python -m pytest --collect-only -q tests/unit/test_memory_artwork_contract.py | sed '/^$/d')"
          artwork_count="$(grep -c '::' <<<"$artwork_ids")"
          [[ "$artwork_count" -eq 63 ]] || {
            echo "Memory artwork collection mismatch: expectedCount=63 actualCount=$artwork_count" >&2
            exit 1
          }
          grep -Fq 'test_mounted_route_rejects_unauthenticated_request_before_service_work' <<<"$artwork_ids"
          grep -Fq 'test_backfill_is_bounded_to_newest_ten_and_retry_is_idempotent' <<<"$artwork_ids"
          grep -Fq 'test_firestore_transaction_contract_rejects_source_and_lease_drift' <<<"$artwork_ids"
          grep -Fq 'test_sensitive_classification_drift_at_egress_recheck_blocks_provider' <<<"$artwork_ids"
          grep -Fq 'test_signed_url_requires_current_bound_consent' <<<"$artwork_ids"
          grep -Fq 'test_signed_url_rereads_consent_after_awaited_authority_resolution' <<<"$artwork_ids"
          grep -Fq 'test_signed_url_releases_artwork_that_finishes_during_authority_resolution' <<<"$artwork_ids"
          grep -Fq 'test_release_off_is_a_signed_url_kill_switch' <<<"$artwork_ids"
          grep -Fq 'test_process_requires_current_durable_job_claim_before_provider' <<<"$artwork_ids"
          grep -Fq 'test_mounted_internal_process_route_uses_durable_worker_job_claim' <<<"$artwork_ids"
          grep -Fq 'test_durable_worker_recovers_retryable_job_after_restart' <<<"$artwork_ids"
          grep -Fq 'test_account_deletion_marker_drains_claimed_worker_before_storage_write' <<<"$artwork_ids"
          grep -Fq 'test_firestore_reservation_writes_generation_and_dispatch_in_one_transaction' <<<"$artwork_ids"
          grep -Fq 'test_firestore_retry_reservation_preserves_attempt_history' <<<"$artwork_ids"
          grep -Fq 'test_account_deletion_stops_before_job_cleanup_when_storage_absence_is_unproven' <<<"$artwork_ids"
          grep -Fq 'test_account_deletion_returns_before_cleanup_while_claimed_worker_is_active' <<<"$artwork_ids"
          grep -Fq 'test_terminal_enrichment_hook_runs_idempotent_processor_without_raising' <<<"$artwork_ids"
          grep -Fq 'test_xai_provider_uses_fixed_base64_contract_and_normalizes_dimensions' <<<"$artwork_ids"
          grep -Fq 'test_xai_provider_rejects_vendor_url_only_response' <<<"$artwork_ids"
          grep -Fq 'test_xai_provider_rejects_oversized_response_before_buffering' <<<"$artwork_ids"
          grep -Fq 'test_xai_provider_rejects_encoded_image_before_decode_allocation' <<<"$artwork_ids"
          grep -Fq 'test_expired_job_claim_immediately_before_provider_has_zero_egress' <<<"$artwork_ids"
          grep -Fq 'test_expired_job_claim_after_provider_prevents_storage_egress' <<<"$artwork_ids"
          grep -Fq 'test_memory_deletion_marker_drains_claimed_worker_before_storage_write' <<<"$artwork_ids"
          grep -Fq 'test_processing_job_activity_requires_a_future_lease' <<<"$artwork_ids"
          grep -Fq 'test_xai_provider_selection_fails_closed_without_credential' <<<"$artwork_ids"
          grep -Fq 'test_signed_url_rechecks_sensitive_source_before_release' <<<"$artwork_ids"
          grep -Fq 'test_failed_storage_write_remains_covered_by_cleanup_marker' <<<"$artwork_ids"
          grep -Fq 'test_cleanup_marker_failure_prevents_object_upload' <<<"$artwork_ids"
          grep -Fq 'test_global_consent_revocation_at_final_egress_check_blocks_provider' <<<"$artwork_ids"
          grep -Fq 'test_objectless_ready_artwork_is_atomically_rereserved_for_generation' <<<"$artwork_ids"
          grep -Fq 'test_automatic_generation_is_durably_one_shot_but_manual_retry_remains_available' <<<"$artwork_ids"
          grep -Fq 'test_firestore_reservation_replaces_objectless_ready_state_and_completed_job' <<<"$artwork_ids"
          grep -Fq 'test_firestore_automatic_reservation_cannot_requeue_an_existing_generation' <<<"$artwork_ids"
          grep -Fq 'test_gcs_signed_url_rejects_a_missing_object_before_signing' <<<"$artwork_ids"
          grep -Fq 'test_missing_ready_blob_is_demoted_and_can_be_rereserved' <<<"$artwork_ids"
          grep -Fq 'test_stale_missing_blob_read_cannot_demote_a_new_same_key_generation_claim' <<<"$artwork_ids"
          grep -Fq 'test_pending_job_query_is_bounded_to_due_work_and_ordered' <<<"$artwork_ids"
          python -m pytest -q -rA tests/unit/test_memory_artwork_contract.py \
            | tee /tmp/memory-artwork-pytest.log
          grep -Eq '63 passed' /tmp/memory-artwork-pytest.log
          ! grep -Eqi '(^|[[:space:]])(skipped|deselected)([[:space:]]|$)' /tmp/memory-artwork-pytest.log
          printf 'Memory artwork execution receipt: expectedCount=63 actualCount=63 skipped=0 deselected=0\n'

      - name: Run real Firestore summary CAS and artwork dispatch inventory
        working-directory: backend
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/callback-cas-python/bin/activate"
          cas_ids="$(python -m pytest --collect-only -q tests/unit/test_conversation_summary_cas.py | sed '/^$/d')"
          cas_count="$(grep -c '::' <<<"$cas_ids")"
          [[ "$cas_count" -eq 5 ]] || {
            echo "Firestore CAS collection mismatch: expectedCount=5 actualCount=$cas_count" >&2
            exit 1
          }
          artwork_firestore_ids="$(python -m pytest --collect-only -q tests/unit/test_memory_artwork_firestore.py | sed '/^$/d')"
          artwork_firestore_count="$(grep -c '::' <<<"$artwork_firestore_ids")"
          [[ "$artwork_firestore_count" -eq 1 ]] || {
            echo "Firestore artwork collection mismatch: expectedCount=1 actualCount=$artwork_firestore_count" >&2
            exit 1
          }
          grep -Fq 'test_real_firestore_generation_and_dispatch_commit_and_repair_together' <<<"$artwork_firestore_ids"

          emulator_name="omi-summary-cas-firestore-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker run --rm -d \
            --name "$emulator_name" \
            -p 127.0.0.1::8080 \
            gcr.io/google.com/cloudsdktool/google-cloud-cli@sha256:cda01b8c880e9161992c3fd61d7d0e153b4dd073aa4a9d62ad79243907cf8dd4 \
            gcloud beta emulators firestore start --host-port=0.0.0.0:8080 --quiet
          cleanup_emulator() {
            docker rm -f "$emulator_name" >/dev/null 2>&1 || true
          }
          trap cleanup_emulator EXIT
          emulator_port="$(docker port "$emulator_name" 8080/tcp | awk -F: 'END {print $NF}')"
          [[ -n "$emulator_port" ]]
          export FIRESTORE_EMULATOR_HOST="127.0.0.1:${emulator_port}"
          for attempt in {1..30}; do
            if curl --silent --fail "http://${FIRESTORE_EMULATOR_HOST}/" >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          curl --silent --fail "http://${FIRESTORE_EMULATOR_HOST}/" >/dev/null
          ELLA_FIRESTORE_EMULATOR_TESTS=true \
            python -m pytest -q -rA \
              tests/unit/test_conversation_summary_cas.py \
              tests/unit/test_memory_artwork_firestore.py \
            | tee /tmp/firestore-summary-cas-pytest.log
          grep -Eq '6 passed' /tmp/firestore-summary-cas-pytest.log
          ! grep -Eqi '(^|[[:space:]])(skipped|deselected)([[:space:]]|$)' \
            /tmp/firestore-summary-cas-pytest.log
          printf 'Firestore CAS/artwork execution receipt: expectedCount=6 actualCount=6 skipped=0 deselected=0\n'
