name: Ella iOS Source CI

on:
  pull_request:
    branches:
      - codex/815-device-rejection-successor
      - feature/phase-a-testflight
      - main
      - release/1242-build-824
    paths:
      - app/**
      - backend/main.py
      - backend/database/authority_advisory_lock.py
      - backend/database/ella_provisioning.py
      - backend/database/honcho_attestation.py
      - backend/database/managed_cloud_consent.py
      - backend/database/runtime_targets.py
      - backend/database/voice_canary.py
      - backend/ella/routers/ai_consent.py
      - backend/ella/routers/guardian.py
      - backend/database/action_items.py
      - backend/database/chat.py
      - backend/database/conversations.py
      - backend/database/memory_artwork.py
      - backend/database/folders.py
      - backend/database/redis_db.py
      - backend/database/task_sync.py
      - backend/database/user_usage.py
      - backend/ella/__init__.py
      - backend/CAPTURE_PROTOCOL_V2_ROLLOUT.md
      - backend/models/conversation.py
      - backend/models/message_event.py
      - backend/routers/conversations.py
      - backend/routers/pusher.py
      - backend/routers/task_integrations.py
      - backend/routers/transcribe.py
      - backend/routers/users.py
      - backend/utils/conversations/capture_authority.py
      - backend/utils/conversations/process_conversation.py
      - backend/utils/analytics.py
      - backend/utils/app_integrations.py
      - backend/utils/stt/streaming.py
      - backend/utils/webhooks.py
      - backend/utils/ella/postprocess.py
      - backend/utils/llm/knowledge_graph.py
      - backend/ella/routers/resolve.py
      - backend/ella/routers/escalations.py
      - backend/ella/routers/chat.py
      - backend/ella/routers/canonical_events.py
      - backend/ella/routers/corrections.py
      - backend/ella/routers/voice.py
      - backend/ella/services/correction_honcho_contract.py
      - backend/ella/services/hermes_session.py
      - backend/ella/routers/callbacks.py
      - backend/ella/routers/memory_artwork.py
      - backend/ella/services/runtime_resolver.py
      - backend/ella/services/ai_consent.py
      - backend/ella/services/consent_authority.py
      - backend/ella/services/correction_propagation.py
      - backend/ella/services/hermes_cloud.py
      - backend/ella/services/hermes_cloud_policy.py
      - backend/ella/services/hermes_cloud_staged_attestation.py
      - backend/ella/services/memory_artwork.py
      - backend/ella/services/provisioning.py
      - backend/ella/services/runtime_errors.py
      - backend/ella/services/summary_recovery.py
      - backend/ella/services/canonical_summary_source.py
      - backend/ella/services/summary_writeback.py
      - backend/ella/docs/SUMMARY_CAS_ROLLOUT.md
      - backend/ella/docs/MEMORY_ARTWORK_V1.md
      - backend/ella/utils/provision_authority.py
      - backend/tests/unit/test_ella_correction_startup_contract.py
      - backend/tests/unit/test_ella_conversation_corrections.py
      - backend/tests/unit/test_ella_correction_runtime_resolver.py
      - backend/tests/unit/test_ella_guardian_delivery.py
      - backend/tests/unit/test_ella_canonical_context.py
      - backend/tests/unit/test_ella_canonical_event_version_fence.py
      - backend/tests/unit/test_ella_canonical_omi.py
      - backend/tests/unit/test_ella_user_route_auth.py
      - backend/tests/unit/test_ella_v2v_turn_persistence.py
      - backend/tests/unit/test_conversation_summary_cas.py
      - backend/tests/unit/test_ella_callbacks_summary_update.py
      - backend/tests/unit/test_memory_artwork_contract.py
      - backend/tests/unit/test_memory_artwork_firestore.py
      - backend/tests/fixtures/ella_canonical_source_v1.json
      - backend/tests/unit/test_ella_chat_temporal_context.py
      - backend/tests/unit/test_ella_correction_honcho_contract.py
      - backend/utils/ella/exact_firebase_auth.py
      - backend/utils/ella/canonical_omi.py
      - backend/utils/ella/scanner.py
      - backend/utils/ella/memory_artwork_storage.py
      - backend/utils/notifications.py
      - backend/utils/task_sync.py
      - firestore.indexes.json
      - backend/tests/unit/test_guardian_notification_delivery.py
      - backend/tests/unit/test_capture_task_sync_idempotency.py
      - backend/tests/unit/test_conversation_processing_failures.py
      - .github/workflows/ella-ios-source-ci.yml
  workflow_dispatch:
    inputs:
      immutable_base_sha:
        description: Immutable ancestor SHA used for the complete source-stack diff
        required: true
        type: string

concurrency:
  group: ella-ios-source-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flutter-source:
    name: Flutter source, guards, and tests
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      ELLA_CI_FLUTTER_VERSION: 3.41.1
      ELLA_EXPECTED_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      ELLA_CI_NETWORK_SANDBOX: >-
        (version 1) (allow default) (deny network*)
        (allow network-inbound (local ip "localhost:*"))
        (allow network-outbound (remote ip "localhost:*"))
    defaults:
      run:
        shell: bash
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact checked-out head
        working-directory: .
        env:
          ELLA_EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          [[ "$ELLA_EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Source CI requires an exact 40-character head SHA." >&2
            exit 1
          }
          actual_head_sha="$(git rev-parse HEAD)"
          [[ "$actual_head_sha" == "$ELLA_EXPECTED_HEAD_SHA" ]] || {
            echo "Expected exact head $ELLA_EXPECTED_HEAD_SHA, checked out $actual_head_sha." >&2
            exit 1
          }
          echo "Verified exact source head: $actual_head_sha"

      - name: Verify immutable checked-out head
        working-directory: .
        run: |
          set -euo pipefail

          expected_head="${ELLA_EXPECTED_HEAD_SHA}"
          [[ "$expected_head" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Source CI requires an exact 40-character immutable head SHA." >&2
            exit 1
          }
          checked_out_head="$(git rev-parse HEAD)"
          [[ "$checked_out_head" == "$expected_head" ]] || {
            echo "Checked-out HEAD $checked_out_head does not match expected immutable head $expected_head." >&2
            exit 1
          }
          printf 'Exact-head gate receipt: event=%s expected_head=%s checked_out_HEAD=%s\n' \
            "${GITHUB_EVENT_NAME}" "$expected_head" "$checked_out_head"
          {
            echo '### Exact-head gate receipt'
            printf -- '- Event: `%s`\n' "${GITHUB_EVENT_NAME}"
            printf -- '- Expected immutable SHA: `%s`\n' "$expected_head"
            printf -- '- Checked-out HEAD: `%s`\n' "$checked_out_head"
          } >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$expected_head" > /tmp/ella-ios-source-ci-head-sha.txt
          echo "ELLA_SOURCE_HEAD_SHA=$checked_out_head" >> "$GITHUB_ENV"
          {
            echo "### Ella iOS Source CI receipt"
            echo
            echo "Immutable source head: \`$checked_out_head\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify credential-free source CI scope
        working-directory: .
        run: |
          set -euo pipefail

          workflow=".github/workflows/ella-ios-source-ci.yml"
          forbidden_ci_terms='(ASC_|KEYCHAIN|TestFlight|appstore|app-store|build-and-upload|xcodebuild|fastlane|codesign|mobileprovision|\.p8|\.p12)'
          if grep -Ev 'forbidden_ci_terms|forbidden_artifact_paths|secret_patterns|Credentialed iOS build/upload terms|grep -EIn|workflow=' "$workflow" \
            | grep -EIn "$forbidden_ci_terms"; then
            echo "Credentialed iOS build/upload terms are not allowed in this hosted source CI workflow." >&2
            exit 1
          fi

      - name: Diff and signing artifact scan
        working-directory: .
        env:
          ELLA_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          ELLA_DISPATCH_BASE_SHA: ${{ inputs.immutable_base_sha }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            base_ref="${ELLA_PR_BASE_SHA}"
          else
            base_ref="${ELLA_DISPATCH_BASE_SHA}"
          fi

          [[ "$base_ref" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Source CI requires an exact 40-character immutable base SHA." >&2
            exit 1
          }
          git cat-file -e "${base_ref}^{commit}"
          git merge-base --is-ancestor "$base_ref" HEAD || {
            echo "Source CI base $base_ref is not an ancestor of HEAD $(git rev-parse HEAD)." >&2
            exit 1
          }
          printf '%s\n' "$base_ref" > /tmp/ella-ios-source-ci-base-ref.txt

          git diff --check "${base_ref}...HEAD"
          git diff --name-only "${base_ref}...HEAD" | tee /tmp/ella-ios-source-ci-changed-files.txt
          while IFS= read -r -d '' changed_path; do
            case "$changed_path" in
            app/*|backend/CAPTURE_PROTOCOL_V2_ROLLOUT.md|backend/main.py|backend/database/action_items.py|backend/database/authority_advisory_lock.py|backend/database/chat.py|backend/database/conversations.py|backend/database/ella_provisioning.py|backend/database/folders.py|backend/database/honcho_attestation.py|backend/database/managed_cloud_consent.py|backend/database/memory_artwork.py|backend/database/redis_db.py|backend/database/runtime_targets.py|backend/database/task_sync.py|backend/database/user_usage.py|backend/database/voice_canary.py|backend/ella/__init__.py|backend/ella/docs/MEMORY_ARTWORK_V1.md|backend/ella/docs/SUMMARY_CAS_ROLLOUT.md|backend/ella/routers/ai_consent.py|backend/ella/routers/callbacks.py|backend/ella/routers/canonical_events.py|backend/ella/routers/chat.py|backend/ella/routers/corrections.py|backend/ella/routers/escalations.py|backend/ella/routers/guardian.py|backend/ella/routers/memory_artwork.py|backend/ella/routers/resolve.py|backend/ella/routers/voice.py|backend/ella/services/ai_consent.py|backend/ella/services/canonical_summary_source.py|backend/ella/services/consent_authority.py|backend/ella/services/correction_honcho_contract.py|backend/ella/services/correction_propagation.py|backend/ella/services/hermes_cloud.py|backend/ella/services/hermes_cloud_policy.py|backend/ella/services/hermes_cloud_staged_attestation.py|backend/ella/services/hermes_session.py|backend/ella/services/memory_artwork.py|backend/ella/services/provisioning.py|backend/ella/services/runtime_errors.py|backend/ella/services/runtime_resolver.py|backend/ella/services/summary_recovery.py|backend/ella/services/summary_writeback.py|backend/ella/utils/provision_authority.py|backend/models/conversation.py|backend/models/message_event.py|backend/routers/conversations.py|backend/routers/pusher.py|backend/routers/task_integrations.py|backend/routers/transcribe.py|backend/routers/users.py|backend/utils/analytics.py|backend/utils/app_integrations.py|backend/utils/conversations/capture_authority.py|backend/utils/conversations/process_conversation.py|backend/utils/ella/canonical_context.py|backend/utils/ella/canonical_omi.py|backend/utils/ella/exact_firebase_auth.py|backend/utils/ella/memory_artwork_storage.py|backend/utils/ella/postprocess.py|backend/utils/ella/scanner.py|backend/utils/llm/knowledge_graph.py|backend/utils/notifications.py|backend/utils/stt/streaming.py|backend/utils/task_sync.py|backend/utils/webhooks.py|backend/tests/fixtures/ella_canonical_source_v1.json|backend/tests/unit/test_capture_task_sync_idempotency.py|backend/tests/unit/test_conversation_processing_failures.py|backend/tests/unit/test_conversation_summary_cas.py|backend/tests/unit/test_ella_callbacks_summary_update.py|backend/tests/unit/test_ella_canonical_context.py|backend/tests/unit/test_ella_canonical_event_version_fence.py|backend/tests/unit/test_ella_canonical_omi.py|backend/tests/unit/test_ella_chat_temporal_context.py|backend/tests/unit/test_ella_conversation_corrections.py|backend/tests/unit/test_ella_correction_honcho_contract.py|backend/tests/unit/test_ella_correction_runtime_resolver.py|backend/tests/unit/test_ella_correction_startup_contract.py|backend/tests/unit/test_ella_guardian_delivery.py|backend/tests/unit/test_ella_user_route_auth.py|backend/tests/unit/test_ella_v2v_turn_persistence.py|backend/tests/unit/test_guardian_notification_delivery.py|backend/tests/unit/test_memory_artwork_contract.py|backend/tests/unit/test_memory_artwork_firestore.py|docs/compliance/ella-managed-cloud-consent-v*.md|firestore.indexes.json|.github/workflows/ella-ios-source-ci.yml) ;;
              *)
                echo "Ella iOS source CI rejects unrelated changed path: $changed_path" >&2
                exit 1
                ;;
            esac
          done < <(git diff --name-only -z "${base_ref}...HEAD")

          forbidden_artifact_paths='(^|/)(AuthKey_[^/]*\.p8|[^/]*\.(p8|p12|cer|mobileprovision|provisionprofile|xcarchive|ipa))$'
          if grep -EIn "$forbidden_artifact_paths" /tmp/ella-ios-source-ci-changed-files.txt; then
            echo "Signing certificates, provisioning profiles, archives, and IPA artifacts must not be committed." >&2
            exit 1
          fi

      - name: Diff secret scan
        working-directory: .
        run: |
          set -euo pipefail

          base_ref="$(cat /tmp/ella-ios-source-ci-base-ref.txt)"

          git diff --unified=0 "${base_ref}...HEAD" > /tmp/ella-ios-source-ci.diff
          secret_patterns='(-----BEGIN ((RSA|DSA|EC|OPENSSH) )?PRIVATE KEY-----|AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{35}|gh[pousr]_[A-Za-z0-9_]{36,}|sk-(live|test)-[A-Za-z0-9]{20,}|sk-proj-[A-Za-z0-9_-]{20,}|xox[baprs]-[A-Za-z0-9-]{20,})'
          if grep -EIn "$secret_patterns" /tmp/ella-ios-source-ci.diff; then
            echo "Potential secret found in PR diff." >&2
            exit 1
          fi

      - name: Run executable native Guardian production manager and auth boundaries
        working-directory: .
        run: |
          set -euo pipefail
          swiftc -warnings-as-errors -D GUARDIAN_NATIVE_POLICY_TESTS \
            app/ios/Runner/GuardianMode/GuardianNativePolicy.swift \
            app/ios/Runner/GuardianMode/GuardianModePollingService.swift \
            app/ios/Tests/GuardianNativePolicyTests.swift \
            -o "$RUNNER_TEMP/guardian-native-policy-tests"
          "$RUNNER_TEMP/guardian-native-policy-tests"

      - name: Run Apple Reminders replay-idempotency production boundary
        working-directory: .
        run: |
          set -euo pipefail
          swiftc -warnings-as-errors \
            app/ios/Runner/AppleRemindersSyncIdempotency.swift \
            app/ios/Runner/AppleRemindersSyncService.swift \
            app/ios/Tests/AppleRemindersSyncIdempotencyTests.swift \
            -o "$RUNNER_TEMP/apple-reminders-sync-idempotency-tests"
          "$RUNNER_TEMP/apple-reminders-sync-idempotency-tests"

      - name: Run Ella voice route native policy and static gates
        working-directory: .
        run: |
          set -euo pipefail

          swiftc -warnings-as-errors \
            app/ios/Runner/EllaVoiceAudioRoutePolicy.swift \
            app/ios/Tests/EllaVoiceAudioRoutePolicyTests.swift \
            -o "$RUNNER_TEMP/ella-voice-audio-route-policy-tests"
          "$RUNNER_TEMP/ella-voice-audio-route-policy-tests"

          iphoneos_sdk="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun swiftc -typecheck -warnings-as-errors \
            -sdk "$iphoneos_sdk" \
            -target arm64-apple-ios15.0 \
            app/ios/Runner/EllaVoiceAudioRoutePolicy.swift
          xcrun swiftc -frontend -parse app/ios/Runner/AppDelegate.swift

          swift format lint --strict \
             app/ios/Runner/EllaVoiceAudioRoutePolicy.swift \
             app/ios/Tests/EllaVoiceAudioRoutePolicyTests.swift
          plutil -lint app/ios/Runner.xcodeproj/project.pbxproj

      - name: Run Guardian data-only production boundary tests
        working-directory: .
        run: |
          python3 -m venv "$RUNNER_TEMP/guardian-python"
          source "$RUNNER_TEMP/guardian-python/bin/activate"
          python3 -m pip install --disable-pip-version-check \
            pytest==8.4.2 \
            fastapi==0.112.0 \
            firebase-admin==6.5.0 \
            httpx==0.28.0 \
            Jinja2==3.1.4 \
            asyncpg==0.31.0 \
            python-multipart==0.0.9 \
            websockets==15.0.1
          python3 -m unittest backend/tests/unit/test_guardian_notification_delivery.py
          python3 -m pytest backend/tests/unit/test_ella_guardian_delivery.py \
            -k 'guardian_next_audio_auth or guardian_playback_auth or guardian_mode'
          python3 -m pytest backend/tests/unit/test_ella_user_route_auth.py
          task_sync_tests=(
            'backend/tests/unit/test_capture_task_sync_idempotency.py::test_task_sync_receipt_reclaim_and_completion_are_exact_claim_cas'
            'backend/tests/unit/test_capture_task_sync_idempotency.py::test_real_auto_sync_batch_old_worker_after_successor_creates_one_external_item[todoist]'
            'backend/tests/unit/test_capture_task_sync_idempotency.py::test_real_auto_sync_batch_old_worker_after_successor_creates_one_external_item[asana]'
            'backend/tests/unit/test_capture_task_sync_idempotency.py::test_real_auto_sync_batch_old_worker_after_successor_creates_one_external_item[google_tasks]'
            'backend/tests/unit/test_capture_task_sync_idempotency.py::test_real_auto_sync_batch_old_worker_after_successor_creates_one_external_item[clickup]'
            'backend/tests/unit/test_capture_task_sync_idempotency.py::test_real_auto_sync_batch_old_worker_after_successor_creates_one_external_item[apple_reminders]'
            'backend/tests/unit/test_conversation_processing_failures.py::test_capture_action_items_auto_sync_threads_stable_effect_operation_to_real_batch_caller'
          )
          expected_task_sync_tests="${#task_sync_tests[@]}"
          echo "Running exact task-sync replay inventory: ${expected_task_sync_tests} required tests"
          set +e
          python -m pytest -q -rs "${task_sync_tests[@]}" | tee "$RUNNER_TEMP/task-sync-replay-pytest.txt"
          task_sync_status="${PIPESTATUS[0]}"
          set -e
          if [[ "$task_sync_status" -ne 0 ]]; then
            exit "$task_sync_status"
          fi
          if grep -Eq '[0-9]+ skipped|[0-9]+ deselected' "$RUNNER_TEMP/task-sync-replay-pytest.txt"; then
            echo 'Task-sync replay inventory may not skip or deselect required tests.' >&2
            exit 1
          fi
          if ! grep -Eq "${expected_task_sync_tests} passed" "$RUNNER_TEMP/task-sync-replay-pytest.txt"; then
            echo "Task-sync replay inventory did not execute exactly ${expected_task_sync_tests} tests." >&2
            exit 1
          fi
          capture_tests=(
            'backend/tests/unit/test_conversation_processing_failures.py::test_capture_finalization_route_requires_exact_id_and_rejects_non_owner_before_mutation'
            'backend/tests/unit/test_conversation_processing_failures.py::test_capture_finalization_route_successor_mismatch_fails_before_any_conversation_mutation'
            'backend/tests/unit/test_conversation_processing_failures.py::test_capture_finalization_route_cross_id_document_fails_before_pointer_claim'
            'backend/tests/unit/test_conversation_processing_failures.py::test_capture_finalization_v2_rejects_missing_and_stale_protocol_authority_tuple'
            'backend/tests/unit/test_conversation_processing_failures.py::test_capture_finalization_lost_ack_and_repeats_converge_without_duplicate_side_effects'
            'backend/tests/unit/test_conversation_processing_failures.py::test_capture_finalization_compare_delete_cannot_clear_successor_race'
            'backend/tests/unit/test_conversation_processing_failures.py::test_capture_finalization_processing_replay_does_not_touch_successor_or_side_effects'
            'backend/tests/unit/test_conversation_processing_failures.py::test_capture_finalization_pointer_acquisition_failure_preserves_exact_pointer'
            'backend/tests/unit/test_conversation_processing_failures.py::test_capture_finalization_preclaim_failure_restores_exact_pointer_for_safe_replay[enrichment]'
            'backend/tests/unit/test_conversation_processing_failures.py::test_capture_finalization_preclaim_failure_restores_exact_pointer_for_safe_replay[firestore_claim]'
            'backend/tests/unit/test_conversation_processing_failures.py::test_capture_finalization_preclaim_failure_retains_an_existing_processing_fence'
            'backend/tests/unit/test_conversation_processing_failures.py::test_capture_finalization_preclaim_restore_cannot_overwrite_successor_or_finalize_wrong_capture'
            'backend/tests/unit/test_conversation_processing_failures.py::test_capture_finalization_firestore_claim_is_atomic_and_exact'
            'backend/tests/unit/test_conversation_processing_failures.py::test_capture_writer_rechecks_firestore_status_inside_transaction_after_finalization_wins'
            'backend/tests/unit/test_conversation_processing_failures.py::test_capture_v2_fails_closed_until_actual_legacy_writer_drain'
            'backend/tests/unit/test_conversation_processing_failures.py::test_capture_stale_pause_then_successor_adopt_rejects_write_and_stale_arrays'
            'backend/tests/unit/test_conversation_processing_failures.py::test_capture_finalization_process_kill_boundary_reclaims_expired_durable_lease'
            'backend/tests/unit/test_conversation_processing_failures.py::test_capture_stale_finalizer_cannot_persist_after_expired_lease_is_reclaimed'
            'backend/tests/unit/test_conversation_processing_failures.py::test_capture_successor_installation_is_one_atomic_transaction_without_rollback_delete'
            'backend/tests/unit/test_conversation_processing_failures.py::test_capture_successor_install_publishes_each_exact_ready_tuple'
            'backend/tests/unit/test_conversation_processing_failures.py::test_capture_drain_waits_for_final_segment_persistence_scheduling_race'
            'backend/tests/unit/test_conversation_processing_failures.py::test_capture_redis_keys_share_real_cluster_slot'
            'backend/tests/unit/test_conversation_processing_failures.py::test_capture_drain_body_rejects_missing_wrong_and_stale_authority_fields'
            'backend/tests/unit/test_conversation_processing_failures.py::test_capture_pre_v2_clients_are_rejected_before_creation_and_leave_zero_active_state'
            'backend/tests/unit/test_conversation_processing_failures.py::test_capture_drain_rechecks_idle_after_provider_returns_with_late_tail'
            'backend/tests/unit/test_conversation_processing_failures.py::test_capture_drain_barrier_waits_for_copied_final_provider_tail_before_finalization_claim'
            'backend/tests/unit/test_conversation_processing_failures.py::test_capture_finalization_expired_lease_cannot_be_renewed_or_persisted'
            'backend/tests/unit/test_conversation_processing_failures.py::test_capture_reclaimed_finalizer_fences_all_late_side_effect_classes'
            'backend/tests/unit/test_conversation_processing_failures.py::test_capture_effect_claim_after_successful_guard_rejects_expired_predecessor'
            'backend/tests/unit/test_conversation_processing_failures.py::test_capture_finalization_resumes_after_result_persistence_at_every_terminal_boundary'
            'backend/tests/unit/test_conversation_processing_failures.py::test_capture_finalization_effect_paths_reject_wrong_owner_generation_and_claim_token'
            'backend/tests/unit/test_conversation_processing_failures.py::test_capture_effect_reclaim_reuses_stable_idempotency_token'
            'backend/tests/unit/test_conversation_processing_failures.py::test_capture_effect_successful_claim_then_expiry_reclaim_deduplicates_resumed_predecessor'
