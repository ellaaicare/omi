          tests/unit/test_ella_guardian_delivery.py
          tests/unit/test_ella_reviewed_route_integration.py
          tests/unit/test_ella_runtime_route_isolation.py
          tests/unit/test_ella_scanner_batching.py
          tests/unit/test_ella_listen_runtime_gate.py
          tests/unit/test_ella_observer.py tests/unit/test_invitation_redemption.py
          tests/unit/test_ella_plato_mcp.py
          tests/unit/test_ella_provision_authority_split.py
          tests/unit/test_pilot_invite_admin.py
          tests/unit/test_ella_onboarding_contract.py
          tests/unit/test_ella_provisioning_service.py
          tests/unit/test_hermes_cloud_openapi.py
          tests/unit/test_hermes_cloud_enrichment.py
          tests/unit/test_hermes_cloud_photon.py
          tests/unit/test_hermes_broker_prototype.py
          tests/unit/test_hermes_binding_envelope_contract.py
          tests/unit/test_hermes_product_fit_canary.py
          tests/unit/test_hermes_cloud_provider.py
          tests/unit/test_hermes_cloud_runtime.py
          tests/unit/test_hermes_cloud_staged_attestation.py
          tests/unit/test_memory_reinterpretation_outbox.py
          tests/unit/test_ella_scanner_batching.py
          tests/unit/test_scanner_keyterms.py
          tests/postgres/test_hermes_cloud_pool_postgres.py
          tests/postgres/test_authority_advisory_lock_postgres.py
          tests/postgres/test_invitation_redemption_postgres.py
          tests/postgres/test_runtime_migration_atomicity_postgres.py
          &&
          python -c "import yaml; from openapi_spec_validator import validate; validate(yaml.safe_load(open('ella/docs/hermes-cloud-runtime-targets.openapi.yaml', encoding='utf-8')))"

      - name: Run Hermes Cloud and isolation failure-path tests
        run: |
          set -euo pipefail
          collected="$(
            pytest --collect-only -q \
              tests/unit/test_ella_ai_consent.py \
              tests/unit/test_ella_ai_consent_route_gates.py \
              tests/unit/test_hermes_cloud_migration.py \
              tests/unit/test_hermes_cloud_openapi.py \
              tests/unit/test_hermes_cloud_policy.py \
              tests/unit/test_hermes_broker_prototype.py \
              tests/unit/test_hermes_binding_envelope_contract.py \
              tests/unit/test_hermes_product_fit_canary.py \
              tests/unit/test_hermes_cloud_photon.py \
              tests/unit/test_hermes_cloud_provider.py \
              tests/unit/test_hermes_cloud_provisioning.py \
              tests/unit/test_hermes_cloud_runtime.py \
              tests/unit/test_hermes_cloud_staged_attestation.py \
              tests/unit/test_hermes_cloud_enrichment.py \
              tests/unit/test_hermes_cloud_enrichment_outbox.py \
              tests/unit/test_hermes_cloud_enrichment_router.py \
              tests/unit/test_ella_postprocess_cloud_routing.py \
              tests/unit/test_ella_chat_temporal_context.py \
              tests/unit/test_ella_provisioning_repository.py \
              tests/unit/test_ella_provisioning_service.py \
              tests/unit/test_ella_runtime_route_isolation.py \
              tests/unit/test_voice_proxy_auth.py \
              tests/postgres/test_hermes_cloud_pool_postgres.py \
              tests/postgres/test_invitation_redemption_postgres.py \
              tests/postgres/test_runtime_migration_atomicity_postgres.py |
              grep -c '::'
          )"
          required_ids=(
