jobs:
  hermes-cloud-runtime:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hermes_cloud_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hermes_cloud_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ELLA_VOICE_CANARY_ENFORCEMENT_ENABLED: "false"
      ELLA_TEST_POSTGRES_DSN: postgresql://postgres:postgres@127.0.0.1:5432/hermes_cloud_test
      FIRESTORE_EMULATOR_HOST: localhost:9999
      GCLOUD_PROJECT: omi-ci
      GOOGLE_CLOUD_PROJECT: omi-ci
      ENCRYPTION_SECRET: omi_ci_hermes_cloud_test_only_32_bytes
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install focused test dependencies
        run: >-
          python -m pip install
          "asyncpg==0.31.0"
          "black==24.8.0"
          "fastapi==0.112.0"
          "firebase-admin==6.5.0"
          "httpx==0.28.0"
          "jsonschema==4.23.0"
          "PyJWT==2.9.0"
          "pytest==8.3.2"
          "openapi-spec-validator==0.7.1"
          "PyYAML==6.0.2"
          "python-multipart==0.0.9"
          "websockets==12.0"

      - name: Compile Hermes Cloud runtime modules
        run: >-
          python -m py_compile
          database/authority_advisory_lock.py
          database/conversations.py
          database/redis_db.py
          database/ella_caregivers.py
          database/ella_provisioning.py
          database/ella_postgres.py
          database/honcho_attestation.py
          database/hermes_cloud_enrichment_outbox.py
          database/invitations.py
          database/managed_cloud_consent.py
          database/runtime_targets.py
          database/voice_canary.py
          models/conversation.py
          models/conversation_integrity.py
          models/hermes_cloud_enrichment_contract.py
          routers/transcribe.py
          routers/conversations.py
          routers/developer.py
          routers/users.py
          utils/capture_buffer.py
          utils/conversations/process_conversation.py
          utils/conversations/postprocess_conversation.py
          utils/conversations/merge_conversations.py
          routers/pusher.py routers/transcribe.py routers/integration.py routers/workflow.py
          ella/__init__.py
          ella/routers/auto_provision.py
          ella/routers/callbacks.py
