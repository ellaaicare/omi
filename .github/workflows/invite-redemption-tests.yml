name: Invite Redemption Tests

on:
  pull_request:
    paths:
      - "backend/contracts/authority_advisory_lock_v1.json"
      - "backend/database/authority_advisory_lock.py"
      - "backend/database/ella_provisioning.py"
      - "backend/database/honcho_attestation.py"
      - "backend/database/invitation_operator.py"
      - "backend/database/invitations.py"
      - "backend/database/managed_cloud_consent.py"
      - "backend/database/runtime_targets.py"
      - "backend/database/voice_canary.py"
      - "backend/ella/routers/invites.py"
      - "backend/ella/routers/onboarding.py"
      - "backend/ella/routers/ai_consent.py"
      - "backend/ella/services/consent_authority.py"
      - "backend/ella/services/invitation_authority.py"
      - "backend/ella/services/provisioning.py"
      - "backend/ella/services/runtime_resolver.py"
      - "backend/ella/services/hermes_cloud_policy.py"
      - "backend/ella/utils/provision_authority.py"
      - "backend/ella/routers/voice.py"
      - "backend/ella/__init__.py"
      - "backend/migrations/011_create_invitation_redemption.sql"
      - "backend/migrations/012_create_account_profile_runtime_targets.sql"
      - "backend/migrations/013_create_managed_cloud_consent_authority.sql"
      - "backend/migrations/014_add_synthetic_invitation_operator_audit.sql"
      - "backend/migrations/015_add_invitation_allowed_email_hash.sql"
      - "backend/scripts/pilot_invite_admin.py"
      - "backend/scripts/synthetic_invite_admin.py"
      - "backend/ella/docs/INVITE_REDEMPTION_CONTROL_PLANE.md"
      - "backend/ella/docs/SYNTHETIC_INVITE_OPERATOR.md"
      - "backend/tests/unit/test_invitation_redemption.py"
      - "backend/tests/unit/test_pilot_invite_admin.py"
      - "backend/tests/unit/test_authority_writer_guard.py"
      - "backend/tests/unit/test_ella_onboarding_contract.py"
      - "backend/tests/unit/test_ella_provisioning_service.py"
      - "backend/tests/unit/test_synthetic_invite_admin.py"
      - "backend/tests/postgres/test_invitation_redemption_postgres.py"
      - "backend/tests/postgres/test_runtime_migration_atomicity_postgres.py"
      - ".github/workflows/invite-redemption-tests.yml"
  push:
    branches: [main]
    paths:
      - "backend/contracts/authority_advisory_lock_v1.json"
      - "backend/database/authority_advisory_lock.py"
      - "backend/database/ella_provisioning.py"
      - "backend/database/honcho_attestation.py"
      - "backend/database/invitation_operator.py"
      - "backend/database/invitations.py"
      - "backend/database/managed_cloud_consent.py"
      - "backend/database/runtime_targets.py"
      - "backend/database/voice_canary.py"
      - "backend/ella/routers/invites.py"
      - "backend/ella/routers/onboarding.py"
      - "backend/ella/routers/ai_consent.py"
      - "backend/ella/services/consent_authority.py"
      - "backend/ella/services/invitation_authority.py"
      - "backend/ella/services/provisioning.py"
      - "backend/ella/services/runtime_resolver.py"
      - "backend/ella/services/hermes_cloud_policy.py"
      - "backend/ella/utils/provision_authority.py"
      - "backend/ella/routers/voice.py"
      - "backend/ella/__init__.py"
      - "backend/migrations/011_create_invitation_redemption.sql"
      - "backend/migrations/012_create_account_profile_runtime_targets.sql"
      - "backend/migrations/013_create_managed_cloud_consent_authority.sql"
      - "backend/migrations/014_add_synthetic_invitation_operator_audit.sql"
      - "backend/migrations/015_add_invitation_allowed_email_hash.sql"
      - "backend/scripts/pilot_invite_admin.py"
      - "backend/scripts/synthetic_invite_admin.py"
      - "backend/ella/docs/INVITE_REDEMPTION_CONTROL_PLANE.md"
      - "backend/ella/docs/SYNTHETIC_INVITE_OPERATOR.md"
      - "backend/tests/unit/test_invitation_redemption.py"
      - "backend/tests/unit/test_pilot_invite_admin.py"
      - "backend/tests/unit/test_authority_writer_guard.py"
      - "backend/tests/unit/test_ella_onboarding_contract.py"
      - "backend/tests/unit/test_ella_provisioning_service.py"
      - "backend/tests/unit/test_synthetic_invite_admin.py"
      - "backend/tests/postgres/test_invitation_redemption_postgres.py"
      - "backend/tests/postgres/test_runtime_migration_atomicity_postgres.py"
      - ".github/workflows/invite-redemption-tests.yml"

jobs:
  invite-redemption:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: invite_redemption_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d invite_redemption_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ELLA_TEST_POSTGRES_DSN: postgresql://postgres:postgres@127.0.0.1:5432/invite_redemption_test
      ENCRYPTION_SECRET: omi_ci_invite_redemption_only
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install focused test dependencies
        run: >-
          python -m pip install
          "asyncpg==0.31.0"
          "fastapi==0.112.0"
          "firebase-admin==6.5.0"
          "httpx==0.28.0"
          "PyJWT==2.9.0"
          "pydantic==2.8.2"
          "python-multipart==0.0.9"
          "pytest==8.3.2"
          "websockets==12.0"

      - name: Compile invite and entitlement modules
        run: >-
          python -m py_compile
          database/authority_advisory_lock.py
          database/ella_provisioning.py
          database/honcho_attestation.py
          database/invitation_operator.py
          database/invitations.py
          database/managed_cloud_consent.py
          database/runtime_targets.py
          database/voice_canary.py
          ella/routers/invites.py
          ella/routers/onboarding.py
          ella/routers/ai_consent.py
          ella/services/consent_authority.py
          ella/services/invitation_authority.py
          ella/services/provisioning.py
          ella/services/runtime_resolver.py
          ella/services/hermes_cloud_policy.py
          ella/utils/provision_authority.py
          scripts/synthetic_invite_admin.py
          scripts/pilot_invite_admin.py

      - name: Run unit and PostgreSQL security tests
        run: |
          set -euo pipefail

          collected="$(
            pytest --collect-only -q \
              tests/unit/test_invitation_redemption.py \
              tests/unit/test_synthetic_invite_admin.py \
              tests/unit/test_pilot_invite_admin.py \
              tests/unit/test_authority_writer_guard.py \
              tests/unit/test_voice_canary.py \
              tests/unit/test_ella_onboarding_contract.py \
              tests/unit/test_ella_provisioning_service.py \
              tests/postgres/test_invitation_redemption_postgres.py \
              tests/postgres/test_runtime_migration_atomicity_postgres.py |
              grep -c '::'
          )"
          test "$collected" -eq 160
          collected_ids="$(
            pytest --collect-only -q \
              tests/unit/test_invitation_redemption.py \
              tests/unit/test_pilot_invite_admin.py \
              tests/unit/test_authority_writer_guard.py \
              tests/unit/test_ella_onboarding_contract.py \
              tests/unit/test_ella_provisioning_service.py \
              tests/postgres/test_invitation_redemption_postgres.py \
              tests/postgres/test_runtime_migration_atomicity_postgres.py |
              sed '/^$/d'
          )"
          required_ids=(
            "tests/unit/test_invitation_redemption.py::test_redeem_rejects_unverified_firebase_email_before_authority_or_database"
            "tests/unit/test_ella_onboarding_contract.py::test_authority_rejection_precedes_identity_and_repository_side_effects"
            "tests/unit/test_pilot_invite_admin.py::test_self_hosted_admission_uses_verified_email_and_current_policy_without_uid_allowlist"
            "tests/unit/test_pilot_invite_admin.py::test_scoped_email_interface_keeps_plaintext_out_of_argv_receipts_logs_and_errors"
            "tests/unit/test_pilot_invite_admin.py::test_operator_examples_never_embed_plaintext_email_or_legacy_email_argument"
            "tests/unit/test_ella_onboarding_contract.py::test_onboarding_ensure_requires_current_ai_consent_dependency"
            "tests/unit/test_ella_provisioning_service.py::test_self_hosted_invitation_admission_precedes_identity_and_job_writes"
            "tests/unit/test_ella_provisioning_service.py::test_self_hosted_authority_drift_blocks_before_provider_call"
            "tests/unit/test_ella_provisioning_service.py::test_invitation_runtime_requires_persisted_profile_local_honcho_proof"
            "tests/unit/test_ella_provisioning_service.py::test_authenticated_honcho_attestation_rejects_replay_swaps_staleness_and_partial_proofs"
            "tests/unit/test_ella_provisioning_service.py::test_missing_attestation_key_fails_before_provisioner_or_binding_write"
            "tests/unit/test_ella_provisioning_service.py::test_retained_authority_inventory_mutation_sensitivity_across_all_roots_and_aliases"
            "tests/unit/test_ella_provisioning_service.py::test_primary_fallback_authorities_preserve_outbound_selection_and_legacy_truthiness"
            "tests/unit/test_ella_provisioning_service.py::test_authority_credential_presence_optional_none_and_redacted_separation_contract"
            "tests/unit/test_ella_provisioning_service.py::test_attestation_key_separation_tracks_runtime_credential_lookups_from_source"
            "tests/unit/test_ella_provisioning_service.py::test_attestation_key_separation_retains_real_honcho_consumer_authorities_after_env_reload"
            "tests/unit/test_ella_provisioning_service.py::test_attestation_window_covers_max_slow_response_and_rejects_invalid_config"
            "tests/unit/test_ella_provisioning_service.py::test_total_deadline_cancels_real_local_slow_drip_before_binding_writes"
            "tests/unit/test_ella_provisioning_service.py::test_oversized_provision_receipt_is_rejected_before_parse_or_binding_write"
            "tests/unit/test_ella_provisioning_service.py::test_total_deadline_rejects_delayed_json_parse_before_binding_write"
            "tests/unit/test_ella_provisioning_service.py::test_total_deadline_stops_delayed_verification_and_local_publication[verification]"
            "tests/unit/test_ella_provisioning_service.py::test_total_deadline_stops_delayed_verification_and_local_publication[staging]"
            "tests/unit/test_ella_provisioning_service.py::test_total_deadline_stops_delayed_verification_and_local_publication[activation]"
            "tests/unit/test_ella_provisioning_service.py::test_external_cancellation_after_provider_work_records_retryable_reconciliation"
            "tests/unit/test_ella_provisioning_service.py::test_post_provider_attestation_rejections_retry_and_reconcile_one_binding"
            "tests/unit/test_ella_provisioning_service.py::test_retained_owner_identity_is_exact_and_requires_server_configuration"
            "tests/postgres/test_invitation_redemption_postgres.py::test_self_hosted_redemption_binds_verified_email_identity_and_target_atomically"
            "tests/postgres/test_invitation_redemption_postgres.py::test_self_hosted_email_mismatch_and_concurrent_open_redeem_fail_closed"
            "tests/postgres/test_invitation_redemption_postgres.py::test_pilot_operator_rotation_is_atomic_idempotent_and_preserves_email_scope"
            "tests/postgres/test_invitation_redemption_postgres.py::test_pilot_reviewer_quota_expiry_and_revoke_are_fail_closed"
            "tests/postgres/test_invitation_redemption_postgres.py::test_pilot_capacity_concurrent_sixth_denial_has_zero_side_effects_and_review_is_separate"
            "tests/postgres/test_invitation_redemption_postgres.py::test_pilot_issue_absolute_expiry_recovers_ambiguous_outcome_without_duplicate_or_orphan"
            "tests/postgres/test_invitation_redemption_postgres.py::test_self_hosted_runtime_resolution_is_invitation_authoritative_and_exact"
            "tests/postgres/test_invitation_redemption_postgres.py::test_self_hosted_activation_rejects_tampered_attestation_before_publication"
            "tests/postgres/test_invitation_redemption_postgres.py::test_self_hosted_resolution_rechecks_attestation_inside_authority_transaction"
            "tests/postgres/test_invitation_redemption_postgres.py::test_self_hosted_key_separation_is_rechecked_at_activation_and_resolution"
            "tests/postgres/test_invitation_redemption_postgres.py::test_self_hosted_revoke_invalidates_authority_and_blocks_reactivation"
            "tests/postgres/test_invitation_redemption_postgres.py::test_self_hosted_post_provider_revoke_race_cannot_publish_or_retry"
            "tests/postgres/test_runtime_migration_atomicity_postgres.py::test_migration_015_upgrades_multi_redemption_app_review_history_atomically"
          )
          for required_id in "${required_ids[@]}"; do
            grep -Fqx "$required_id" <<<"$collected_ids"
          done
          pytest \
            tests/unit/test_invitation_redemption.py \
            tests/unit/test_synthetic_invite_admin.py \
            tests/unit/test_pilot_invite_admin.py \
            tests/unit/test_authority_writer_guard.py \
            tests/unit/test_voice_canary.py \
            tests/unit/test_ella_onboarding_contract.py \
            tests/unit/test_ella_provisioning_service.py \
            tests/postgres/test_invitation_redemption_postgres.py \
            tests/postgres/test_runtime_migration_atomicity_postgres.py \
            -v | tee /tmp/invite-redemption-pytest.log
          ! grep -Eq '[0-9]+ skipped' /tmp/invite-redemption-pytest.log
