name: iOS Build & TestFlight

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

concurrency:
  group: ios-build
  cancel-in-progress: true

jobs:
  build-ios:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 60
    env:
      FLUTTER_ROOT: /Users/ellaai/dev/flutter
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up environment
        run: |
          echo "$FLUTTER_ROOT/bin" >> $GITHUB_PATH
          echo "/opt/homebrew/opt/ruby/bin" >> $GITHUB_PATH
          echo "/opt/homebrew/lib/ruby/gems/4.0.0/bin" >> $GITHUB_PATH
          echo "/opt/homebrew/bin" >> $GITHUB_PATH

      - name: Run test suite
        working-directory: app
        run: |
          flutter pub get
          flutter test --no-pub

      - name: Build and Upload
        working-directory: app/ios
        run: |
          export SKIP_PULL=1
          export ASC_ISSUER_ID="${{ secrets.ASC_ISSUER_ID }}"
          ./build-and-upload.sh
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}

      - name: Clean up
        if: always()
        working-directory: app
        run: rm -rf build/ios/EllaCare.xcarchive /tmp/EllaCarePayload /tmp/EllaCare.ipa
