name: Issue Secret Scanner

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]

permissions:
  issues: write

jobs:
  scan-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Extract text to scan
        id: extract
        uses: actions/github-script@v7
        with:
          script: |
            let text = '';
            let source = '';
            let commentId = null;

            if (context.eventName === 'issue_comment') {
              text = context.payload.comment.body || '';
              source = `comment #${context.payload.comment.id} on issue #${context.payload.issue.number}`;
              commentId = context.payload.comment.id;
            } else {
              text = (context.payload.issue.title || '') + '\n' + (context.payload.issue.body || '');
              source = `issue #${context.payload.issue.number} body`;
            }

            core.setOutput('text', text);
            core.setOutput('source', source);
            core.setOutput('comment_id', commentId || '');
            core.setOutput('issue_number', context.payload.issue.number);

      - name: Scan for secrets
        id: scan
        env:
          SCAN_TEXT: ${{ steps.extract.outputs.text }}
        shell: bash
        run: |
          FINDINGS=""
          FOUND=0

          # --- Pattern definitions ---
          # Each pattern: "LABEL:::REGEX"
          PATTERNS=(
            # Tailscale IPs (100.x.x.x private range)
            "Tailscale IP:::100\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}"

            # NVIDIA API keys
            "NVIDIA API Key:::nvapi-[A-Za-z0-9_-]{20,}"

            # OpenAI API keys
            "OpenAI API Key:::sk-[A-Za-z0-9]{20,}"

            # XAI API keys
            "XAI API Key:::xai-[A-Za-z0-9]{20,}"

            # Anthropic API keys
            "Anthropic API Key:::sk-ant-[A-Za-z0-9_-]{20,}"

            # OMI MCP API keys
            "OMI MCP Key:::omi_mcp_[a-f0-9]{20,}"

            # Firebase project IDs (omi-dev-XXXXX pattern)
            "Firebase Project ID:::omi-dev-[a-z0-9]{4,}"

            # ElevenLabs API keys
            "ElevenLabs Key:::[a-f0-9]{32}"

            # Generic bearer tokens in curl commands
            "Bearer Token:::Bearer [A-Za-z0-9_.-]{20,}"

            # SSH commands with IP addresses
            "SSH Command:::ssh\s+[-\w]*@?[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}"

            # Inworld API keys
            "Inworld Key:::inworld[_-]?[A-Za-z0-9]{16,}"

            # Gemini/Google API keys
            "Google API Key:::AIza[A-Za-z0-9_-]{35}"

            # Generic long hex strings that look like API keys (32+ hex chars)
            "Possible API Key:::['\"][a-f0-9]{32,}['\"]"
          )

          for entry in "${PATTERNS[@]}"; do
            LABEL="${entry%%:::*}"
            REGEX="${entry##*:::}"

            MATCHES=$(echo "$SCAN_TEXT" | grep -oEi "$REGEX" 2>/dev/null || true)
            if [[ -n "$MATCHES" ]]; then
              FOUND=1
              # Mask the matches for the finding report (show first/last 4 chars)
              while IFS= read -r match; do
                if [[ ${#match} -gt 12 ]]; then
                  MASKED="${match:0:4}...${match: -4}"
                else
                  MASKED="${match:0:3}***"
                fi
                FINDINGS="${FINDINGS}\n- **${LABEL}**: \`${MASKED}\`"
              done <<< "$MATCHES"
            fi
          done

          # Also check for private IP ranges beyond Tailscale
          PRIVATE_IPS=$(echo "$SCAN_TEXT" | grep -oE '(10\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}|172\.(1[6-9]|2[0-9]|3[01])\.[0-9]{1,3}\.[0-9]{1,3}|192\.168\.[0-9]{1,3}\.[0-9]{1,3})' 2>/dev/null || true)
          if [[ -n "$PRIVATE_IPS" ]]; then
            FOUND=1
            while IFS= read -r ip; do
              FINDINGS="${FINDINGS}\n- **Private IP**: \`${ip:0:4}...*\`"
            done <<< "$PRIVATE_IPS"
          fi

          echo "found=$FOUND" >> "$GITHUB_OUTPUT"

          # Write findings to file for next step (avoids shell escaping issues)
          echo -e "$FINDINGS" > /tmp/findings.txt

      - name: Post warning comment
        if: steps.scan.outputs.found == '1'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const findings = fs.readFileSync('/tmp/findings.txt', 'utf8').trim();
            const source = '${{ steps.extract.outputs.source }}';
            const issueNumber = parseInt('${{ steps.extract.outputs.issue_number }}');

            const body = [
              '> [!CAUTION]',
              '> **Potential secrets detected** in ' + source,
              '>',
              '> The following patterns were flagged by the automated secret scanner:',
              '>',
              findings.split('\n').map(line => '> ' + line).join('\n'),
              '>',
              '> **Please review and redact any sensitive information immediately.**',
              '> If these are false positives, you can ignore this warning.',
              '',
              '_This is an automated scan. Patterns checked: API keys, private IPs, tokens, project IDs._'
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: body
            });

            // Also fail the check so it shows in the issue timeline
            core.setFailed('Potential secrets detected in ' + source + '. Review the warning comment.');
